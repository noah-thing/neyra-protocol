name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
        exclude:
          # Hosted macOS runners are scarce, and queued jobs get dropped.
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv pip install -e '.[dev]'
      - if: runner.os == 'macOS' && matrix.python != '3.10'
        run: uv pip install -e '.[dev,mlx]'
      - name: torch, to run the editing tests on the CPU backend (CPU wheels on Linux)
        if: matrix.python == '3.12'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then uv pip install torch --index-url https://download.pytorch.org/whl/cpu; fi
          uv pip install -e '.[dev,torch]'
      - run: uv run --no-sync ruff check src tests experiments scripts extensions fuzz
      - run: uv run --no-sync pytest -q

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - run: go run . vectors ../../spec/vectors
        working-directory: impl/go

  wheel:
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv build
      - name: install the wheel alone into a fresh venv and run every command that needs no model
        run: |
          uv venv --python ${{ matrix.python }} /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/python scripts/smoke_installed.py

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - run: uv pip install -e '.[dev]'
      - run: uv run --no-sync python fuzz/differential.py --cases 5000 --batches 2

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - run: uv pip install -e .
      - run: uv run --no-sync neyra demo files "$RUNNER_TEMP/toy"
      - name: a correct merge passes
        uses: ./
        with:
          base: ${{ runner.temp }}/toy/base
          merged: ${{ runner.temp }}/toy/merged
          adapter: ${{ runner.temp }}/toy/adapter
          package: .
      - name: an adapter that was never applied fails the job
        id: broken
        uses: ./
        continue-on-error: true
        with:
          base: ${{ runner.temp }}/toy/base
          merged: ${{ runner.temp }}/toy/forgot-to-merge
          adapter: ${{ runner.temp }}/toy/adapter
          package: .
      - name: it did fail, and said so
        run: test "${{ steps.broken.outcome }}" = failure && test "${{ steps.broken.outputs.equivalent }}" = false
