<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="neyra tune verdict scoring a public LoRA against the base, a prompt and quantized files"><rect x=".5" y=".5" width="999" height="469" rx="8" fill="#161b22" stroke="#30363d"/><circle cx="22" cy="20" r="5" fill="#30363d"/><circle cx="40" cy="20" r="5" fill="#30363d"/><circle cx="58" cy="20" r="5" fill="#30363d"/><text x="22" y="54" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e6edf3">$ neyra tune verdict Qwen/Qwen2.5-0.5B-Instruct ./adapter cases.jsonl --examples train.jsonl --shots 40 --gguf *.gguf</text><text x="22" y="98" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#58a6ff">This worked: the tuned model scores 98.5% on 200 cases, against 62.5% for the base and 90.0% with 40 examples in the</text><text x="22" y="120" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#58a6ff">prompt; it is +8.5 points ahead of the best free option, few-shot (interval +5.0 to +12.5)</text><text x="22" y="164" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8b949e">          score    against base                    against few-shot</text><text x="22" y="186" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e6edf3">base      62.5%</text><text x="22" y="208" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e6edf3">few-shot  90.0%     +27.5 [+21.0, +34.5] +60/-5</text><text x="22" y="230" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e6edf3">tuned     98.5%     +36.0 [+29.5, +42.5] +73/-1      +8.5 [+5.0, +12.5] +17/-0</text><text x="22" y="252" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e6edf3">F16       98.5%     +36.0 [+29.5, +42.5] +73/-1      +8.5 [+5.0, +12.5] +17/-0</text><text x="22" y="274" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e6edf3">Q8_0      98.5%     +36.0 [+29.5, +42.5] +73/-1      +8.5 [+5.0, +12.5] +17/-0</text><text x="22" y="296" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e6edf3">Q4_K_M    98.5%     +36.0 [+29.5, +42.5] +73/-1      +8.5 [+5.0, +12.5] +17/-0</text><text x="22" y="318" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e6edf3">Q3_K_S    97.5%     +35.0 [+28.0, +42.0] +72/-2      +7.5 [+4.0, +11.5] +16/-1</text><text x="22" y="340" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e6edf3">Q2_K      97.5%     +35.0 [+28.5, +41.5] +71/-1      +7.5 [+4.0, +11.5] +16/-1</text><text x="22" y="384" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8b949e">Damage</text><text x="22" y="406" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e6edf3">  general questions: base 83.3%, tuned 96.7% of 30 (+13.3 points, interval +3.3 to +26.7)</text><text x="22" y="428" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e6edf3">  cases the base got right and the tuned model got wrong: 1 of 200</text></svg>