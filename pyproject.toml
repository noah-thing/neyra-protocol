[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lesion"
version = "0.1.0"
description = "Version control for what a neural network does: diff, blame, bisect and patch model weights."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Noah" }]
keywords = ["llm", "interpretability", "model-editing", "safetensors", "mcp"]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.32"]
torch = ["torch>=2.6", "transformers>=5.0", "accelerate"]
mcp = ["mcp>=2.0"]
gguf = ["gguf>=0.17"]
dev = ["pytest>=8", "pytest-asyncio", "ruff", "mcp>=2.0"]

[project.scripts]
lesion = "lesion.cli:main"
lesion-mcp = "lesion.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lesion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs real model weights on disk"]
addopts = "-m 'not model'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
